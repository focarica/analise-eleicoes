services:
  postgres:
    image: postgres:16
    container_name: analise-eleicoes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tse_load}
      POSTGRES_USER: ${POSTGRES_USER:-tse_loader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tse_loader} -d ${POSTGRES_DB:-tse_load}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
